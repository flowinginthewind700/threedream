# CI + CD in one file, on purpose.
#
# GitHub Actions cannot express `needs:` across workflow files, so splitting the
# gate (ci.yml) from the deploy (pages.yml) would publish main even when tests
# are red. The only structural guarantee is one graph where `deploy` depends on
# every gate job. `tests/ci_workflow.test.ts` pins that dependency, the SHA
# pinning of every action, and the absence of deploy permissions on gate jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the deploy job widens its own permissions. A gate job
# that can publish is a gate job that can be tricked into publishing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast loop: typecheck, unit tests, production build. ~1 min.
  verify:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # No `submodules:` -- thirdparty/UnrealEngine is a gitlink to Epic's
        # private repo and runners have no EULA access, so recursion would fail.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Matches the engines floor in package.json; asserted by tests.
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # Coverage is a separate job because it is a *threshold* gate, not a
  # correctness one -- `verify` already runs the same tests un-instrumented.
  # v8 instrumentation also lands on the training inner loop, where it costs
  # ~10x; the two convergence tests in tests/trainer.test.ts are skipped here
  # for that reason (COVERAGE=1, 185s -> 3s) and they contribute ~0.3% of
  # branch coverage. Parallel and independent, so neither job masks the other.
  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Coverage (thresholds enforced by vitest.config.ts)
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn

  # The render layer has no unit coverage: `render/scene.ts` constructs a real
  # WebGLRenderer. This job is its spec, on software GL (SwiftShader).
  e2e:
    name: Browser tests (render layer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Publishes the demo only when every gate passed, and only on main.
  deploy:
    name: Deploy demo to GitHub Pages
    runs-on: ubuntu-latest
    needs: [verify, coverage, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # VITE_BASE is what makes the emitted asset refs carry the /<repo>/ prefix;
      # without it the deployed page is a blank viewport with no console error.
      - name: Build for Pages
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
